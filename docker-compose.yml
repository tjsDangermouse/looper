# Local development stack: GraphHopper (walking graph) behind the Looper route
# service. The PWA talks only to the route service on :8080.
name: looper

services:
  graphhopper-iom:
    build:
      context: ./graphhopper
      args:
        GRAPHHOPPER_VERSION: ${GRAPHHOPPER_VERSION:-11.0}
    environment:
      # A file already in ./data wins; otherwise the extract is downloaded once.
      OSM_PBF_PATH: ${OSM_PBF_IOM_PATH:-isle-of-man-latest.osm.pbf}
      OSM_PBF_URL: ${OSM_PBF_IOM_URL:-https://download.geofabrik.de/europe/isle-of-man-latest.osm.pbf}
      GH_HEAP: ${GH_IOM_HEAP:-2g}
    volumes:
      # The imported graph survives restarts and rebuilds of the image.
      - graph-cache-iom:/data/graph-cache
      - ./data:/data/osm
    # Published for local debugging only. The production stack keeps GraphHopper
    # on the internal network with no published port.
    ports:
      - "${GRAPHHOPPER_PORT:-8989}:8989"
    restart: unless-stopped

  graphhopper-england:
    build:
      context: ./graphhopper
      args:
        GRAPHHOPPER_VERSION: ${GRAPHHOPPER_VERSION:-11.0}
    environment:
      OSM_PBF_PATH: ${OSM_PBF_ENGLAND_PATH:-england-latest.osm.pbf}
      OSM_PBF_URL: ${OSM_PBF_ENGLAND_URL:-https://download.geofabrik.de/europe/united-kingdom/england-latest.osm.pbf}
      GH_HEAP: ${GH_ENGLAND_HEAP:-6g}
    volumes:
      - graph-cache-england:/data/graph-cache
      - ./data:/data/osm
    restart: unless-stopped

  route-service:
    build:
      context: ./services/route-service
    environment:
      PORT: 8080
      GRAPHHOPPER_IOM_URL: http://graphhopper-iom:8989
      GRAPHHOPPER_ENGLAND_URL: http://graphhopper-england:8989
      GRAPHHOPPER_PROFILE: ${GRAPHHOPPER_PROFILE:-foot}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${ROUTE_SERVICE_PORT:-8080}:8080"
    depends_on:
      graphhopper-iom:
        condition: service_healthy
      graphhopper-england:
        condition: service_healthy
    restart: unless-stopped

volumes:
  graph-cache-iom:
  graph-cache-england:
