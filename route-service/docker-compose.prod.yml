# Production stack for a small persistent container host (Fly.io machine,
# Render private service pair, Railway, or a plain VPS running compose).
#
# The difference from docker-compose.yml is deliberate and small: GraphHopper
# has no published port, so it is reachable only from the route service over
# the internal Docker network, and only the route service faces the internet.
name: looper

services:
  graphhopper-iom:
    build:
      context: ./graphhopper
      args:
        GRAPHHOPPER_VERSION: ${GRAPHHOPPER_VERSION:-11.0}
    environment:
      OSM_PBF_PATH: ${OSM_PBF_IOM_PATH:-isle-of-man-latest.osm.pbf}
      OSM_PBF_URL: ${OSM_PBF_IOM_URL:-https://download.geofabrik.de/europe/isle-of-man-latest.osm.pbf}
      GH_HEAP: ${GH_IOM_HEAP:-2g}
    volumes:
      - graph-cache-iom:/data/graph-cache
      - osm-data:/data/osm
    expose:
      - "8989"
    restart: unless-stopped

  graphhopper-england:
    build:
      context: ./graphhopper
      args:
        GRAPHHOPPER_VERSION: ${GRAPHHOPPER_VERSION:-11.0}
    environment:
      OSM_PBF_PATH: ${OSM_PBF_ENGLAND_PATH:-england-latest.osm.pbf}
      OSM_PBF_URL: ${OSM_PBF_ENGLAND_URL:-https://download.geofabrik.de/europe/united-kingdom/england-latest.osm.pbf}
      GH_HEAP: ${GH_ENGLAND_HEAP:-6g}
    volumes:
      - graph-cache-england:/data/graph-cache
      - osm-data:/data/osm
    expose:
      - "8989"
    restart: unless-stopped

  route-service:
    build:
      context: .
    environment:
      PORT: 8080
      GRAPHHOPPER_IOM_URL: http://graphhopper-iom:8989
      GRAPHHOPPER_ENGLAND_URL: http://graphhopper-england:8989
      GRAPHHOPPER_PROFILE: ${GRAPHHOPPER_PROFILE:-foot}
      # Set this to the PWA's origin in production, e.g. https://looper.example.
      CORS_ORIGINS: ${CORS_ORIGINS}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      # How many of one walker's routing calls run at once.
      #
      # Six, and measurement says leave it there. Twelve was tried against this
      # stack on 2026-08-26 and made things worse:
      #
      #   parallelism   4.4x ->  8.4x   (as predicted)
      #   ms per call  31-51  -> 54-100 (roughly doubled)
      #   throughput   92.6   -> 77.1   engine calls/second
      #   onchan 5 km   4.4 s -> 11.5 s
      #
      # That was read at the time as the engine being saturated at six. It is
      # not: measured directly on 2026-08-26, GraphHopper answers 793 calls a
      # second at this concurrency and 881 at twelve, and a single leg costs it
      # about five milliseconds. The ~90 a second was *this service's* ceiling,
      # not the engine's — the anti-retrace corridors were built synchronously
      # in Node, at up to 85 ms a call, so the event loop was the queue and
      # raising concurrency only interleaved more geometry on one thread.
      #
      # See bench/probe-engine.mjs, which measures both. Keep six until that
      # script says the engine rather than the service is the thing in the way.
      ROUTING_CONCURRENCY: ${ROUTING_CONCURRENCY:-6}
      # The ceiling across all walkers at once, which is what actually protects
      # the single JVM. Raise it only from a load test — and note the finding
      # above: this engine has less headroom than it looks like it has.
      GRAPHHOPPER_MAX_CONCURRENCY: ${GRAPHHOPPER_MAX_CONCURRENCY:-24}
      # Algorithm flags. Every one of these is a decision the benchmark or a
      # production probe settled, so each ships at its measured default and an
      # unset variable here leaves it exactly there — see src/loops/flags.ts.
      LOOPER_EDGE_OVERLAP: ${LOOPER_EDGE_OVERLAP:-}
      LOOPER_SPREAD_BEARINGS: ${LOOPER_SPREAD_BEARINGS:-}
      LOOPER_DIVERSITY_EARLY_STOP: ${LOOPER_DIVERSITY_EARLY_STOP:-}
      LOOPER_PARETO_ARCHIVE: ${LOOPER_PARETO_ARCHIVE:-}
      LOOPER_LOCAL_REPAIR: ${LOOPER_LOCAL_REPAIR:-}
      LOOPER_NETWORK_AWARE_SEEDS: ${LOOPER_NETWORK_AWARE_SEEDS:-}
      LOOPER_TWO_STAGE_SCREENING: ${LOOPER_TWO_STAGE_SCREENING:-}
      LOOPER_NARROW_CORNER_SWEEP: ${LOOPER_NARROW_CORNER_SWEEP:-}
      LOOPER_PROGRESSIVE_CORNER_SWEEP: ${LOOPER_PROGRESSIVE_CORNER_SWEEP:-}
      LOOPER_BUDGET_DETOUR_GATE: ${LOOPER_BUDGET_DETOUR_GATE:-}
      LOOPER_PULLBACK_TURN_ONLY: ${LOOPER_PULLBACK_TURN_ONLY:-}
      LOOPER_GUIDE_POINT_PULLBACK: ${LOOPER_GUIDE_POINT_PULLBACK:-}
      LOOPER_WAYPOINT_BACKBONE: ${LOOPER_WAYPOINT_BACKBONE:-}
      LOOPER_KEEP_PINNED_SPURS: ${LOOPER_KEEP_PINNED_SPURS:-}
      LOOPER_REQUEST_CACHE: ${LOOPER_REQUEST_CACHE:-}
      LOOPER_MODEL_REGISTRY: ${LOOPER_MODEL_REGISTRY:-}
      LOOPER_ROUTE_MEMO: ${LOOPER_ROUTE_MEMO:-}
      # Phase 10's direct closed-walk engine. Ships off: this only sets the
      # default for requests that do not name an engine, and the iOS developer
      # toggle asks for one explicitly. See src/loops/engine.ts.
      LOOPER_DIRECT_CLOSED_WALK_SEARCH: ${LOOPER_DIRECT_CLOSED_WALK_SEARCH:-}
      LOOPER_DIRECT_CANDIDATE_WALKS: ${LOOPER_DIRECT_CANDIDATE_WALKS:-}
      LOOPER_DIRECT_MIN_ROUTES: ${LOOPER_DIRECT_MIN_ROUTES:-}
      LOOPER_DIRECT_TIMEOUT_MS: ${LOOPER_DIRECT_TIMEOUT_MS:-}
    ports:
      # Nginx is the public HTTPS entry point; keep the service local to this host.
      - "127.0.0.1:${ROUTE_SERVICE_PORT:-8988}:8080"
    depends_on:
      graphhopper-iom:
        condition: service_healthy
      graphhopper-england:
        condition: service_healthy
    restart: unless-stopped

volumes:
  graph-cache-iom:
  graph-cache-england:
  osm-data:
