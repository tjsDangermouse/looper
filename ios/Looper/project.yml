name: Looper
options:
  bundleIdPrefix: com.looperapp
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.28.0
  LooperKit:
    path: ../LooperKit
targets:
  Looper:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Looper
    dependencies:
      - package: MapLibre
      - package: LooperKit
    info:
      path: Looper/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Looper uses your location to find loops that start near you and to show your position while you walk."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Looper can keep giving turn-by-turn guidance while your phone is locked, if you allow location access at all times."
        UIBackgroundModes:
          - location
        ITSAppUsesNonExemptEncryption: false
        LooperAPIBase: $(LOOPER_API_BASE)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.looperapp.Looper
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          LOOPER_API_BASE: "https://www.woollams.com/looper_router"
        Release:
          LOOPER_API_BASE: "https://www.woollams.com/looper_router"
